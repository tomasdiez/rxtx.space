<header class="site-head">
  <div class="container site-head-bar">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="RXTX — home">
      <svg class="brand-glyph" viewBox="0 0 28 12" aria-hidden="true" focusable="false">
        <path d="M0 0l10 6L0 12z"/>
        <path d="M28 0L18 6l10 6z"/>
      </svg>
      <span class="brand-rx">RX</span><span class="brand-tx">TX</span>
    </a>
    <nav class="site-nav" aria-label="Primary">
      <a href="{{ '/transmissions/' | relative_url }}"{% if page.url contains '/transmissions' %} aria-current="page"{% endif %}>Transmissions</a>
      <a href="{{ '/sound/' | relative_url }}"{% if page.url == '/sound/' %} aria-current="page"{% endif %}>Sound</a>
      <a href="{{ '/experiments/' | relative_url }}"{% if page.url == '/experiments/' %} aria-current="page"{% endif %}>Experiments</a>
    </nav>
  </div>
  <div class="ruler" aria-hidden="true"></div>
</header>
