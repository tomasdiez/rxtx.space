    label: "Tune in on the Sound page"

- id: "EXP-001"
  title: "This website"
  status: "live"
  year: "2026"
  description: "An experiment in owning the antenna: static files, a domain, and email, for next to nothing a year. No platform between the studio and whoever is listening. You're looking at it."
