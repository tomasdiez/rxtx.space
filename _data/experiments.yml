- id: "EXP-005"
  title: "Fab City Index 3.0"
  status: "ongoing"
  year: "2026"
  description: "The instrument that measures cities against the 2054 pledge: PITO vs DIDO, plus ρ — how fast a city turns what it learns into action. Barcelona runs on live data; Boston, Santiago and Bali are wired in with clearly labelled placeholders. Methodology v0, in review."
  link:
    url: "https://index.fab.city/"
    label: "The Index"

- id: "EXP-004"
  title: "PLANETAI"
  status: "ongoing"
  year: "2026"
  description: "An instrument for closing the loop between Earth observation and community-scale response: a five-tier open AI stack from planetary foundation models down to fab-lab sensor nodes, with community councils holding veto. A Fab City Foundation research initiative — Core Ideas Paper out since April, applied to the Google AI for Science Innovation Challenge in May. Graduates from the bench if the funding lands."
  link:
    url: "https://planetai.fab.city/"
    label: "The instrument"

- id: "EXP-003"
  title: "Making Sense Bali"
  status: "ongoing"
  year: "2026"
  description: "Citizen-owned air quality sensing for Bali, anchored by Fab Lab Bali: open-hardware nodes built from the Indonesian supply chain (~USD 15–60), a live dashboard, and resident reports over WhatsApp. Born from the smoke after Suwung — replicated in Bali and Tangerang, more nodes deploying soon. The argument is in TX-002."
  link:
    url: "https://mdg-bali.github.io/makingsensebali/"
    label: "The campaign site"

- id: "EXP-002"
  title: "TX live sets"
  status: "ongoing"
  description: "Improvised hardware/software sets, played live in Bali. No fixed tracklist — the room decides."
  link:
